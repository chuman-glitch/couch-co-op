<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couch Co-Op · design study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --night:#14110e; --paper:#f1e8d4; --ink:#2a2420; --cut:#1d37c6; --amber:#f3b23c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--night); color:var(--paper); overflow:hidden; font-family:"Space Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:30; opacity:.12; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .scene { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* cut-outs */
  .piece { cursor:pointer; outline:none; }
  .piece.decor { cursor:default; }
  .piece .lift { transition:transform .35s cubic-bezier(.2,.9,.3,1.3); transform-box:fill-box; transform-origin:center; filter:url(#drop); }
  .piece image.cut { filter:url(#sticker); }
  .piece image.flat { opacity:.95; }
  .piece .paper { fill:var(--paper); stroke:var(--paper); stroke-width:6; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .piece:not(.decor):hover .lift, .piece:focus-visible .lift, .piece.on .lift { transform:translateY(-8px) scale(1.03); }
  .piece.on .lift.low, .piece:hover .lift.low { transform:scale(1.015); }
  .sticker .blue { fill:var(--cut); stroke:var(--paper); stroke-width:6; vector-effect:non-scaling-stroke; }
  .sticker:hover .blue, .sticker.on .blue { fill:#2846e6; }
  .sticker .cordline { fill:none; stroke:#a8977f; stroke-width:1.3; vector-effect:non-scaling-stroke; }
  .st-k { font-weight:700; font-family:"Space Grotesk"; letter-spacing:3px; fill:var(--paper); opacity:.8; }
  .st-t { font-family:Unbounded; font-weight:900; fill:var(--paper); }

  /* hand-drawn layers that draw themselves on hover */
  .doodle { pointer-events:none; }
  .doodle .ln { fill:none; stroke:var(--paper); stroke-width:var(--sw); stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset .55s ease var(--d,0s); }
  .doodle .ray { stroke:#ffd27a; }
  .doodle .dtext { font:700 34px Caveat, cursive; fill:var(--amber); opacity:0; transition:opacity .4s ease var(--d); }
  .piece.on .doodle .dtext { opacity:1; }
  .doodle .fl { transform:scale(0); transform-box:fill-box; transform-origin:50% 100%; transition:transform .4s cubic-bezier(.3,1.7,.5,1) calc(var(--d,0s) + .6s); }
  .doodle .f { fill:#ffbf4d; stroke:var(--paper); stroke-width:var(--sw); stroke-linejoin:round; }
  .doodle .fi { fill:#fff4cf; }
  .doodle .fl path { transform-box:fill-box; transform-origin:50% 100%; animation:flick 1.3s ease-in-out infinite alternate; }
  .doodle .fi { animation-duration:.9s !important; }
  @keyframes flick { 0% { transform:skewX(-5deg) scaleY(.92); } 45% { transform:skewX(4deg) scaleY(1.07); } 100% { transform:skewX(-2deg) scaleY(.97); } }
  .doodle .gl { opacity:0; mix-blend-mode:screen; transition:opacity .7s ease calc(var(--d,0s) + .7s); }
  .doodle .hrt { fill:#e8735a; stroke:var(--paper); stroke-width:calc(var(--sw) * .6); opacity:0; transform-box:fill-box; transform-origin:center; }
  .piece.on .doodle .hrt, .piece:focus-visible .doodle .hrt { animation:floatUp 2.4s ease-out var(--d) infinite; }
  @keyframes floatUp { 0% { opacity:0; transform:translateY(0) scale(.6); } 20% { opacity:1; transform:translateY(-8px) scale(1); } 100% { opacity:0; transform:translateY(-50px) scale(.9) rotate(12deg); } }
  .piece.on .doodle .ln, .piece:focus-visible .doodle .ln, body.dark .piece[data-id="lights"] .doodle .ln { stroke-dashoffset:0; }
  .piece.on .doodle .fl, .piece:focus-visible .doodle .fl, body.dark .piece[data-id="lights"] .doodle .fl { transform:scale(1); }
  .piece.on .doodle .gl, .piece:focus-visible .doodle .gl, body.dark .piece[data-id="lights"] .doodle .gl { opacity:1; }
  body:not(.dark) .piece:not(.on):not(:focus-visible) .doodle * { transition-delay:0s !important; transition-duration:.3s !important; }

  /* paper tags */
  .tag rect { fill:var(--paper); filter:url(#drop); }
  .tag circle { fill:var(--night); }
  .tag text { font:500 27px Caveat, cursive; fill:var(--ink); }
  .tag .n { font-weight:700; fill:var(--cut); }
  .tag .string { fill:none; stroke:#cbbca2; stroke-width:1.2; vector-effect:non-scaling-stroke; opacity:.8; }
  .tag { transition:opacity .3s; }
  .scene.hovering .tag { opacity:.35; }
  .scene.hovering .tag.on { opacity:1; }

  /* lights */
  #veil, #glows { transition:opacity .8s; }
  body.dark #veil { opacity:.55; }
  body.dark #glows { opacity:1; mix-blend-mode:screen; }

  /* frame UI */
  .top { position:fixed; inset:0 0 auto; z-index:10; display:flex; align-items:center; padding:24px clamp(20px,3vw,44px); gap:20px; }
  .logo { font:900 24px Unbounded; letter-spacing:-.6px; color:var(--paper); text-decoration:none; }
  .study { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--amber); }
  .top nav { margin-left:auto; display:flex; gap:8px; }
  .btn { border:0; border-radius:2px; padding:11px 18px; font:700 13px "Space Grotesk"; cursor:pointer; background:var(--paper); color:var(--ink); }
  .btn.ghost { background:#14110e99; color:var(--paper); box-shadow:inset 0 0 0 1px #f1e8d455; }
  .hero { position:fixed; left:clamp(20px,3vw,44px); top:clamp(88px,12vh,128px); z-index:10; pointer-events:none; max-width:min(560px,40vw); }
  .hero h1 { margin:0 0 14px; font:400 clamp(42px,5.4vw,88px)/.92 "Instrument Serif",serif; letter-spacing:-1.5px; }
  .hero em { color:var(--amber); }
  .hero p { margin:0; font-size:15px; line-height:1.5; color:#f1e8d4b0; max-width:26em; }

  /* placeholder window */
  .ov { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#000c; }
  .ov[hidden] { display:none; }
  .card { background:var(--paper); color:var(--ink); width:min(520px,calc(100% - 32px)); padding:30px 32px 34px; position:relative; transform:rotate(-1.2deg); box-shadow:0 30px 80px #000; }
  .card .n { font:700 11px "Space Grotesk"; letter-spacing:2px; color:var(--cut); }
  .card h2 { margin:6px 0 10px; font:400 52px/1 "Instrument Serif",serif; }
  .card p { margin:0; color:#6f675e; }
  .card button { position:absolute; top:14px; right:16px; border:0; background:none; font:700 12px "Space Grotesk"; letter-spacing:1px; cursor:pointer; }

  @media (max-width:760px) and (orientation:portrait) { .hero h1 { font-size:44px; } .study { display:none; } }
  @media (max-height:520px) { .hero h1 { font-size:34px; } .hero p { display:none; } .top { padding:12px 16px; } .logo { font-size:16px; } .btn { padding:7px 11px; font-size:11px; } .hero { top:56px; } }
</style>
</head>

<div class="hero"><h1>A public living room <em>for play.</em></h1><p>Co-op games and interactive art at POST Houston. Shoes off, pick a cushion.</p></div>
<div class="ov" id="ov" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"><button id="close">CLOSE ✕</button><div class="n" id="cardNum"></div><h2 id="cardTitle"></h2><p>Content coming soon. This is a design study: we're settling the look first.</p></div></div>
<script>
  const scene = document.getElementById("scene"), ov = document.getElementById("ov");
  const TITLES = {'book': 'Book the room', 'dropin': 'Drop in', 'publishers': 'For publishers', 'vision': 'Our vision', 'setup': 'The setup', 'sidescreen': 'Side screen', 'program': 'Program', 'visit': 'Visit us'}, NUMS = {'book': '01', 'dropin': '02', 'publishers': '03', 'vision': '04', 'setup': '05', 'sidescreen': '06', 'program': '07', 'visit': '08', 'lights': '09'};
  function open(id) {
    if (id === "lights") return toggleLights();
    document.getElementById("cardNum").textContent = NUMS[id] || "";
    document.getElementById("cardTitle").textContent = TITLES[id] || id;
    ov.hidden = false;
  }
  function toggleLights() {
    const on = document.body.classList.toggle("dark");
    document.getElementById("lightsBtn").textContent = on ? "Lights on" : "Lights off";
  }
  document.getElementById("lightsBtn").onclick = toggleLights;
  document.querySelectorAll("[data-id]").forEach(el => {
    el.addEventListener("click", () => open(el.dataset.id));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(el.dataset.id); } });
    if (!el.classList.contains("piece")) return;
    el.addEventListener("mouseenter", () => {
      scene.classList.add("hovering");
      document.querySelectorAll(`.piece[data-id="${el.dataset.id}"]`).forEach(p => p.classList.add("on"));
      document.querySelectorAll(`.tag[data-for="${el.dataset.id}"]`).forEach(n => n.classList.add("on"));
    });
    el.addEventListener("mouseleave", () => {
      scene.classList.remove("hovering");
      document.querySelectorAll(".on").forEach(n => n.classList.remove("on"));
    });
  });
  document.getElementById("close").onclick = () => (ov.hidden = true);
  ov.addEventListener("click", e => { if (e.target === ov) ov.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") ov.hidden = true; });
</script>
