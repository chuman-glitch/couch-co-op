    <header class="winbar">
      <span class="winnum" id="winNum"></span>
      <h2 id="winTitle">—</h2>

  </section>

<!-- ===== PANEL CONTENT (edit copy here) ===== -->
<template id="panel-vision" data-title="Our vision">
  <p class="kicker">Our vision</p>
  <h3 class="display">Shoes off. <em>Settle in.</em></h3>
  <p class="lead">A third space where people meet through cooperative games, interactive art and culture.</p>
  <figure class="pic"><img src="images/win-vision.jpg" alt="Friends on a long floor sofa playing a co-op game on two screens"></figure>
  <section class="grp">
    <h4>House rules</h4>
    <ul class="ticks"><li>Couches everywhere</li><li>Shoes off at the door</li><li>Room to sprawl on the floor</li></ul>
  </section>
  <section class="grp">
    <h4>Not every game is about winning</h4>
    <p>We pick cooperative experiences that get people talking, teaming up and discovering together. Play, watch, or just hang out.</p>
  </section>
  <section class="grp">
    <h4>Two phases</h4>
    <div class="phases">
      <div><span class="chip">Now · Phase 1</span><p>A pop-up living room inside POST Houston: one scaffold structure, two consoles, 4–6 players.</p></div>
      <div><span class="chip blue">Next · Phase 2</span><p>A permanent home for games and interactive art, with exhibitions, workshops and a full program.</p></div>
    </div>
  </section>
  <p class="small">An initiative by Nōvo Collective.</p>
</template>

<template id="panel-featured" data-title="Featured screen">
  <p class="kicker">The big screen</p>
  <h3 class="display">Now <em>featuring</em></h3>
  <p class="lead">The main screen hosts the featured co-op game. The first title will be announced soon.</p>
  <p class="small">Want your game on this screen? <button class="link" data-open="publishers">See publisher packages →</button></p>
</template>

<template id="panel-sidescreen" data-title="Side screen">
  <p class="kicker">The second screen</p>
  <h3 class="display">Also <em>playing</em></h3>
  <p class="lead">A smaller setup for indie co-op, experimental games and interactive art to try between rounds.</p>
  <figure class="pic"><img src="images/win-sidescreen.jpg" alt="People playing with an interactive light installation projected on the floor and screens"></figure>
  <section class="grp">
    <h4>Lineup</h4>
    <div class="lineup">
      <div class="slot"><span>01</span>Indie co-op pick · TBA</div>
      <div class="slot"><span>02</span>Interactive art piece · TBA</div>
      <div class="slot"><span>03</span>Experimental game · TBA</div>
    </div>
  </section>
  <p class="small">The lineup rotates through the pilot.</p>
</template>

<template id="panel-setup" data-title="The setup">
  <p class="kicker">How the room works</p>
  <h3 class="display">Two consoles, <em>4–6 players</em></h3>
  <p class="lead">A temporary living room built from scaffolding, steel and curtains inside POST Houston. Open enough to see in, enclosed enough to feel like yours.</p>
  <figure class="pic"><img src="images/win-setup.jpg" alt="A scaffold tower with hanging screens and CRT monitors on cinderblocks, next to floor sofas"></figure>
  <div class="facts">
    <div><b>2</b><span>consoles</span></div>
    <div><b>2</b><span>screens: featured + side</span></div>
    <div><b>4–6</b><span>people at a time</span></div>
  </div>
  <section class="grp">
    <h4>Two ways in</h4>
    <div class="two-ways">
      <button class="way" data-open="dropin"><b>Drop in</b><span>Free open play, 10am – 10pm</span></button>
      <button class="way" data-open="book"><b>Book it</b><span>The room to yourselves, $15 / 2 hours</span></button>
    </div>
  </section>
</template>

<template id="panel-dropin" data-title="Drop in">
  <p class="kicker">Open play</p>
  <h3 class="display">Free to play. <em>Just show up.</em></h3>
  <p class="lead">Open <b>every day, 10am – 10pm</b>. Walk in, take your shoes off, join a game. No ticket, no sign-up.</p>
  <figure class="pic"><img src="images/win-dropin.jpg" alt="People on poufs and bean bags with controllers in front of a big screen"></figure>
  <section class="grp">
    <h4>This week</h4>
    <p class="small">When a group books the room it's private for that block. Check before you come.</p>
    <div class="hours" id="openHoursList"></div>
  </section>
  <button class="btn" data-open="book">Book the room · $15 / 2 hours</button>
</template>

<template id="panel-program" data-title="Program">
  <p class="kicker">What's on</p>
  <h3 class="display">Snacks <em>&amp; nights</em></h3>
  <p class="lead">Co-op nights, launches and screenings during the pilot, growing into a full cultural program.</p>
  <figure class="pic"><img src="images/win-program.jpg" alt="A screening night: people on red floor cushions facing a large projection"></figure>
  <section class="grp">
    <h4>During the pilot</h4>
    <div class="program">
      <div><h4>Publisher showcase</h4><p>Featured co-op titles on the main screen.</p></div>
      <div><h4>Co-op nights</h4><p>Hosted play nights and friendly challenges.</p></div>
      <div><h4>Launches &amp; previews</h4><p>First looks and early access.</p></div>
    </div>
  </section>
  <section class="grp">
    <h4>Phase 2</h4>
    <div class="program">
      <div><h4>Exhibitions</h4><p>Rotating, long-term interactive work.</p></div>
      <div><h4>Workshops &amp; labs</h4><p>Artist-led sessions and developer talks.</p></div>
      <div><h4>Talks &amp; screenings</h4><p>Performances and gatherings.</p></div>
    </div>
  </section>
  <p class="small">Dates will be posted here as the pilot is scheduled.</p>
</template>

<template id="panel-publishers" data-title="For publishers">
  <p class="kicker">Publisher showcase</p>
  <h3 class="display">Put your game <em>in the room</em></h3>
  <p class="lead">Your game, played by real groups on real couches, inside one of Houston's busiest cultural venues.</p>
  <figure class="pic"><img src="images/win-publishers.jpg" alt="A featured game on a large screen above a lounge of floor sofas and CRT monitors"></figure>
  <section class="grp">
    <h4>Packages</h4>
    <div class="packages">
      <article class="pkg">
        <p class="chip">Standard</p>
        <p class="price">$3,000</p>
        <p class="term"><b>10 days</b> of placement, spread over two months</p>
      </article>
      <article class="pkg premium">
        <p class="chip blue">Premium</p>
        <p class="price">$7,000</p>
        <p class="term"><b>30 days</b> of placement</p>
      </article>
    </div>
  </section>
  <section class="grp">
    <h4>What you get</h4>
    <p>Audience discovery beyond the usual gaming channels, an experiential campaign, and visibility on the main screen. Tell us about your game and we'll plan the placement with you.</p>
  </section>
  <a class="btn" id="pubMail" href="#">Request a placement</a>
</template>

<template id="panel-visit" data-title="Visit us">
  <p class="kicker">The first edition</p>
  <h3 class="display">Find us at <em>POST Houston</em></h3>
  <p class="lead">The pilot lives inside POST Houston, the former Barbara Jordan Post Office, next to the Theater District and Buffalo Bayou.</p>
  <figure class="pic"><img src="images/post-map.jpg" alt="Map showing POST Houston between the Sawyer Heights neighborhood, the Theater District and Buffalo Bayou"></figure>
  <section class="grp">
    <h4>Address</h4>
    <p><b>POST Houston</b><br>401 Franklin St, Houston, TX</p>
  </section>
  <p class="small">Exact spot and pilot dates coming soon. Questions? <a class="mail" href="mailto:hi@novocollective.org">hi@novocollective.org</a></p>
</template>

<template id="panel-book" data-title="Book the room">
  <p class="kicker">Like a tennis court, but with couches</p>
  <h3 class="display">Book <em>the room</em></h3>
  <p class="lead">Have the living room to yourselves: both consoles, both screens, up to <b><span data-cfg="maxGuests"></span> people</b>. <b>$15 for 2 hours</b>, for the whole room.</p>
  <form class="booking" id="bookingForm" novalidate>
    <fieldset>
      <legend>1 · Day</legend>
      <div class="days" id="days" role="radiogroup" aria-label="Pick a day"></div>
    </fieldset>
    <fieldset>
      <legend>2 · Time <span class="legend-note">2-hour blocks · tap the next block to stay for 4 hours</span></legend>
      <div class="slots" id="slots"></div>
      <div class="key"><span class="k sel"></span>Your booking <span class="k taken"></span>Booked or passed</div>
    </fieldset>
    <fieldset class="row">
      <legend>3 · You</legend>
      <label>Name<input name="name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Group size<select name="guests" id="guests"></select></label>
    </fieldset>
    <div class="summary" id="summary" aria-live="polite">Pick a time block to see your total.</div>
    <button class="btn wide" type="submit">Request booking</button>
    <p class="formmsg" id="formMsg" role="status"></p>
    <p class="small">Outside private bookings, the room is open to everyone for free, 10am – 10pm.</p>
  </form>
</template>

<template id="panel-menu" data-title="Index">
  <p class="kicker">Everything in the room</p>
  <ul class="menu" id="menuList"></ul>
</template>
